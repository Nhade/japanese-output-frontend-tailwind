name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: apps
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /srv/shiori
            git pull --ff-only
            /srv/shiori/venv/bin/pip install -r /srv/shiori/apps/backend/requirements.txt --quiet
            /srv/shiori/venv/bin/python /srv/shiori/scripts/migrate_db.py
            sudo /bin/systemctl restart shiori
